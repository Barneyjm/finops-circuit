[project]
name = "finops-circuit"
version = "0.1.0"
description = "An LLM FinOps agent on decision circuits: what each conversation cost, what it was worth, and what to change"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["decision-circuits>=0.5.4"]

[project.optional-dependencies]
openai = ["decision-circuits[openai]"]
anthropic = ["decision-circuits[anthropic]"]

[project.scripts]
finops = "finops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finops"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
