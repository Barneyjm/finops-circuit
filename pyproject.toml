[project]
name = "llm-tokenomics"
version = "0.1.0"
description = "Tag LLM spend the way cloud spend is tagged, with calibrated decision models, and export it as FOCUS 1.4"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Barney" }]
keywords = ["finops", "focus", "llm", "cost", "tagging", "chargeback", "showback", "decision-circuits", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["decision-circuits>=0.5.5"]  # 0.5.5 retries a rate-limited backend (429) instead of dropping the call

[project.optional-dependencies]
openai = ["decision-circuits[openai]"]
anthropic = ["decision-circuits[anthropic]"]

[project.urls]
Homepage = "https://decisioncircuits.com"
Source = "https://github.com/Barneyjm/llm-tokenomics"
Changelog = "https://github.com/Barneyjm/llm-tokenomics/commits/main"

[project.scripts]
tokenomics = "tokenomics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokenomics"]

[tool.hatch.build.targets.sdist]
exclude = ["scripts/", ".github/"]  # model-training tooling, not part of the package

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tokenomics/html.py" = ["E501"]  # the page's markup and script, kept as written

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
