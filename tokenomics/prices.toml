# Prices per million tokens. Copy this file, change it, and pass it with --prices.
#
# A model is matched by the longest key its name starts with ("gpt-4o-2024-08-06" beats
# "gpt-4o"). `input` and `output` are list prices; `cached_input` is the price of input tokens
# read from the provider's prompt cache (leave it out where there is no cache); `cache_write` and
# `cache_write_1h` are the prices of writing its 5-minute and 1-hour cache, where the provider
# bills that apart (Anthropic; left out, a write bills as input); `discount` is
# your contracted discount off list, 0 to 1, which FOCUS reports as ContractedCost and
# EffectiveCost beside ListCost. These are launch list prices in USD: check them against your
# contract.

[settings]
currency = "USD"
small_model = "gpt-4o-mini"   # the model a downgrade is priced on

[models."gpt-3.5-turbo"]
input = 1.50
output = 2.00

[models."gpt-4"]
input = 30.00
output = 60.00

